<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" class="phoenix-svg-logo">
  <defs>
    <!-- Soft warm flame radial glow filter -->
    <filter id="phoenixGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.65" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Warm gradient for line stroke -->
    <linearGradient id="phoenixGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E57A60" />
      <stop offset="50%" stop-color="#D98A7D" />
      <stop offset="100%" stop-color="#E5A93C" />
    </linearGradient>
    
    <radialGradient id="auraBg" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#D98A7D" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#D98A7D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background warmth circle -->
  <circle cx="60" cy="62" r="38" fill="url(#auraBg)" class="logo-aura" />

  <g filter="url(#phoenixGlow)" fill="none" stroke="url(#phoenixGrad)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Phoenix Body & Head -->
    <path d="M60,32 C61,28 65,22 69,20 C67,25 64,28 61,30 C62,35 60,45 60,54 Z" stroke-width="1.8" />
    
    <!-- Head Crown / Feathers -->
    <path d="M63,23 C66,17 72,15 76,16 C71,20 67,22 65,25" stroke-width="1.2" opacity="0.9" />
    <path d="M61,20 C64,13 69,11 74,11 C70,15 65,18 62,21" stroke-width="1" opacity="0.75" />

    <!-- Left Wing (Graceful layered feathers) -->
    <path d="M59,42 C48,34 32,32 18,36 C30,42 42,46 57,51" stroke-width="1.6" />
    <path d="M57,47 C46,40 33,39 22,43 C33,48 43,51 56,54" stroke-width="1.3" opacity="0.85" />
    <path d="M55,52 C46,47 36,46 27,50 C36,54 45,56 54,57" stroke-width="1.1" opacity="0.7" />

    <!-- Right Wing (Graceful soaring arc) -->
    <path d="M61,42 C72,34 88,32 102,36 C90,42 78,46 63,51" stroke-width="1.6" />
    <path d="M63,47 C74,40 87,39 98,43 C87,48 77,51 64,54" stroke-width="1.3" opacity="0.85" />
    <path d="M65,52 C74,47 84,46 93,50 C84,54 75,56 66,57" stroke-width="1.1" opacity="0.7" />

    <!-- Flowing Flame Tail Ribbons -->
    <path d="M60,56 C60,68 52,78 46,92 C54,84 59,76 60,66 C61,76 66,84 74,92 C68,78 60,68 60,56 Z" stroke-width="1.5" />
    <path d="M57,62 C54,72 45,82 36,96 C46,86 54,76 56,66" stroke-width="1.2" opacity="0.8" />
    <path d="M63,62 C66,72 75,82 84,96 C74,86 66,76 64,66" stroke-width="1.2" opacity="0.8" />

    <!-- Gentle Spark Core -->
    <circle cx="60" cy="46" r="2" fill="#E5A93C" stroke="none" />
  </g>
</svg>
