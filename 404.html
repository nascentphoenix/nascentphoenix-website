<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Nascent Phoenix</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-family: 'Sora', sans-serif;
            font-size: 120px;
            font-weight: 800;
            background: linear-gradient(135deg, #F97316, #2563EB);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-title {
            font-family: 'Sora', sans-serif;
            font-size: 32px;
            margin-bottom: 16px;
            color: #F8FAFC;
        }
        .error-text {
            color: #94A3B8;
            font-size: 18px;
            max-width: 480px;
            margin-bottom: 36px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-text">The page you are looking for doesn't exist or has been moved. Let's get you back on track.</p>
        <a href="/" class="btn-primary">Return to Homepage</a>
    </div>
</body>
</html>
