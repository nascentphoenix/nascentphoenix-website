<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiet Space | Nascent Phoenix</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .error-title {
            font-family: var(--font-serif-heading);
            font-size: 3rem;
            font-weight: 500;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }
        .error-text {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 480px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .return-btn {
            background: var(--text-primary);
            color: var(--bg-primary);
            padding: 0.75rem 1.8rem;
            border-radius: var(--radius-pill);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .return-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <h1 class="error-title">You've wandered off the path</h1>
        <p class="error-text">This page doesn't exist, but quiet stories are waiting just around the corner.</p>
        <a href="index.html" class="return-btn">Return to Sanctuary</a>
    </div>
</body>
</html>
